# This workflow runs every day at 04:17 in Asia/Macau.
name: Update TimeTable Everyday

env:
  USERNAME: ${{ secrets.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

  ###### preferences 配置信息 ######

  # 在这里修改学期代码，用逗号分隔。
  # Set termcode here, separated by commas.
  # Example: 2502,2506
  TERM_CODES: "2609,2702"

  # 日程开始前多少分钟提醒
  # Reminder minutes before each timed event
  ALERT: "30"

  # zh_MO for Chinese, en_US for English
  LOCALE: "zh_MO"


on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Asia/Macau'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Chrome and ChromeDriver
      id: chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-chromedriver: true
        install-dependencies: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: run mainCode
      env:
        CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
      run: |
        python ./main.py

    - name: commit
      run: |
        git config --global user.email calRobot@github.com
        git config --global user.name githubAction
        git add -f "output/${USERNAME}.ics"
        if ! git diff --cached --quiet; then
          git commit -m "update"
        fi

    - name: Push changes
      uses: ad-m/github-push-action@master


